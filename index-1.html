<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173c85">
<title>Land Layout Planner - Live Update</title>
<style>
:root{--text:#17233b;--muted:#667085;--line:#dbe4f2;--blue:#2563eb;--purple:#6d28d9;--green:#15803d}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);
  background:linear-gradient(180deg,#f8fbff,#eef4ff);
}
#home{max-width:760px;margin:auto;padding:16px 14px 32px}
.hero{
  border-radius:24px;padding:22px;color:#fff;
  background:linear-gradient(135deg,#173c85 0%,#2563eb 52%,#6d28d9 100%);
  box-shadow:0 14px 34px rgba(37,99,235,.22);
}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-size:22px;font-weight:950}
h1{margin:0;font-size:28px;line-height:1.1}
.hero p{margin:7px 0 0;color:rgba(255,255,255,.86);font-size:14px}
.badge{display:inline-block;margin-top:12px;border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:800}
.title{font-size:14px;font-weight:900;margin:18px 2px 10px;color:#344054}
.modules{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.module{
  width:100%;text-align:left;color:inherit;background:#fff;border:1px solid var(--line);
  border-radius:22px;padding:18px;min-height:190px;box-shadow:0 8px 24px rgba(31,41,55,.07);
  position:relative;overflow:hidden;cursor:pointer;font:inherit;
}
.module:active{transform:scale(.99)}
.icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;font-weight:900;margin-bottom:14px}
.calc .icon{background:#eaf2ff;color:#1d4ed8} .plan .icon{background:#ecfdf3;color:#15803d}
.module h2{margin:0;font-size:20px} .module p{margin:8px 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.open{font-size:13px;font-weight:900} .calc .open{color:#1d4ed8} .plan .open{color:#15803d}
.strip{position:absolute;left:0;right:0;bottom:0;height:5px} .calc .strip{background:linear-gradient(90deg,#2563eb,#60a5fa)} .plan .strip{background:linear-gradient(90deg,#16a34a,#0f766e)}
.note{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;color:var(--muted);font-size:12px;line-height:1.55;margin-top:14px}

#moduleView{display:none;background:#eef4ff;min-height:100vh}
.moduleTop{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(255,255,255,.96);border-bottom:1px solid #dbe4f2;
}
.backBtn{
  min-height:42px;padding:9px 13px;border-radius:12px;border:1px solid #cfe0ff;
  background:#fff;color:#1d4ed8;font-size:14px;font-weight:850;cursor:pointer;
}
.moduleName{font-weight:900;color:#344054}
#toolFrame{display:block;width:100%;border:0;min-height:calc(100vh - 64px);background:#fff}

@media(max-width:560px){
  .modules{grid-template-columns:1fr}
  .module{min-height:165px}
  h1{font-size:25px}
  .logo{width:54px;height:54px}
}
</style>
</head>
<body>

<main id="home">
  <section class="hero">
    <div class="brand">
      <div class="logo">LL</div>
      <div>
        <h1>Land Layout Planner</h1>
        <p>Land Calculation & Layout Planning</p>
      </div>
    </div>
    <div class="badge">One App • Two Tools</div>
  </section>

  <div class="title">SELECT A TOOL</div>
  <div class="modules">
    <button class="module calc" id="openCalc" type="button">
      <div class="icon">₹</div>
      <h2>Land Calculator</h2>
      <p>Sq.Yd, Vigha, TP/FP deduction, plotted area, land rate and final plotted-yard rate.</p>
      <div class="open">Open Calculator →</div>
      <div class="strip"></div>
    </button>

    <button class="module plan" id="openPlanner" type="button">
      <div class="icon">▦</div>
      <h2>Land Layout Planner</h2>
      <p>Plot dimensions, COP, multiple roads, custom positions, drawing, summary and PDF.</p>
      <div class="open">Open Planner →</div>
      <div class="strip"></div>
    </button>
  </div>

  <div class="note">આ version single-file છે. એટલે Calculator અને Planner બંને આ જ fileની અંદર છે અને અલગ folder/link પર depend નથી કરતા.</div>
</main>

<section id="moduleView">
  <div class="moduleTop">
    <button class="backBtn" id="goHome" type="button">← Home</button>
    <div class="moduleName" id="moduleName">Tool</div>
  </div>
  <iframe id="toolFrame" title="Land Layout Planner Tool"></iframe>
</section>

  const home = document.getElementById('home');
  const moduleView = document.getElementById('moduleView');
  const frame = document.getElementById('toolFrame');
  const name = document.getElementById('moduleName');

  function decodeHtml(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function openTool(kind) {
    const isCalc = kind === 'calc';
    name.textContent = isCalc ? 'Land Calculator' : 'Land Layout Planner';
    frame.srcdoc = decodeHtml(isCalc ? calcB64 : plannerB64);
    home.style.display = 'none';
    moduleView.style.display = 'block';
    window.scrollTo(0,0);
  }

  function backHome() {
    frame.srcdoc = '';
    moduleView.style.display = 'none';
    home.style.display = 'block';
    window.scrollTo(0,0);
  }

  document.getElementById('openCalc').addEventListener('click', () => openTool('calc'));
  document.getElementById('openPlanner').addEventListener('click', () => openTool('planner'));
  document.getElementById('goHome').addEventListener('click', backHome);

  window.addEventListener('message', (e) => {
    if (e.data === 'goHome') backHome();
  });
})();
</script>
